# Planet BSD: site settings and the feed list.
# Add a feed with a [[feed]] block and send it for review.

[site]
title = "Planet BSD"
url = "https://bsdfeed.seuros.net"
description = "News and writing from across the BSDs. This independent proof of concept is hosted temporarily at bsdfeed.seuros.net. After the trial, we plan to transfer the repository and the production feed to the FreeBSD Foundation."
# max_posts = 60            # posts on the page and in the combined feed
# max_posts_per_feed = 5    # so one busy feed cannot fill the page
# max_age_days = 365        # older posts are left out
# excerpt_chars = 500       # plain-text excerpt length
# mute_after_failures = 5   # consecutive failed runs before a feed is hidden

